<!DOCTYPE html>
<html>
<head>
    <title>Microscope Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container" style="max-width: 500px;">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">🔬 Microscope Size Calculator</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <label>Magnification (e.g. 40)</label>
                    <input type="number" step="any" name="mag_sz" class="form-control mb-2" required>
                    
                    <label>Image Size</label>
                    <input type="number" step="any" name="img_sz" class="form-control mb-2" required>
                    
                    <label>Image Unit</label>
                    <select name="img_ut" class="form-select mb-2">
                        <option value="cm">cm</option><option value="mm">mm</option>
                        <option value="um">um</option><option value="nm">nm</option>
                    </select>
                    
                    <label>Required Real Unit</label>
                    <select name="real_ut" class="form-select mb-3">
                        <option value="cm">cm</option><option value="mm">mm</option>
                        <option value="um">um</option><option value="nm">nm</option>
                    </select>
                    
                    <button type="submit" class="btn btn-primary w-100">Calculate</button>
                </form>

                {% if error %} <div class="alert alert-danger mt-3">{{ error }}</div> {% endif %}
                {% if result %} <div class="alert alert-success mt-3"><strong>Result:</strong> {{ result }}</div> {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
